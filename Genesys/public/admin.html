<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GENESYS_FIT // ADMIN_PANEL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        .cyan-glow {
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.2);
        }

        .border-system {
            border: 1px solid rgba(34, 211, 238, 0.1);
        }
    </style>
</head>

<body class="p-4 md:p-10">

    <header class="mb-10 flex justify-between items-center border-b border-cyan-900/50 pb-6">
        <div>
            <h1 class="text-2xl font-black italic tracking-tighter text-cyan-400">GENESYS_FIT // <span
                    class="text-white">COMMAND_CENTER</span></h1>
            <p class="text-slate-500 text-xs font-bold mt-1 uppercase tracking-widest text-cyan-500/50">// Monitoramento
                de Despertados</p>
        </div>
        <div id="stats" class="hidden md:flex gap-4">
            <div class="bg-slate-900 p-3 border-system cyan-glow">
                <p class="text-[10px] text-slate-500 font-bold">TOTAL_USERS</p>
                <p id="totalUsers" class="text-xl font-black">0</p>
            </div>
        </div>
    </header>

    <div class="bg-slate-900/50 border-system overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead class="bg-slate-900 text-cyan-400 text-[10px] uppercase tracking-widest font-black">
                <tr>
                    <th class="p-4">Usuário</th>
                    <th class="p-4">Rank / Status</th>
                    <th class="p-4">Progresso</th>
                    <th class="p-4">Ações</th>
                </tr>
            </thead>
            <tbody id="userTableBody" class="divide-y divide-slate-800">
            </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Suas configurações Biosyntech conectadas
        const firebaseConfig = {
            apiKey: "AIzaSyAC-uFM4pwfXDuKxGvsFM3Z7v7oF0BC3U4",
            authDomain: "biosyntech-8ffe1.firebaseapp.com",
            projectId: "biosyntech-8ffe1",
            storageBucket: "biosyntech-8ffe1.firebasestorage.app",
            messagingSenderId: "642421745104",
            appId: "1:642421745104:web:ef5298a181d4a178f145d5",
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- FUNÇÕES DE COMANDO ---

        // ⚡ DESPERTAR OU REBAIXAR (RANK-S)
        window.toggleRankS = async (uid, currentStatus) => {
            const isAtivo = currentStatus === 'ativo';
            const newStatus = isAtivo ? 'inativo' : 'ativo';
            const newRank = isAtivo ? 'RANK-E' : 'RANK-S'; // Altera a string do Rank também

            const confirmacao = confirm(`[ SISTEMA ] DESEJA ALTERAR O NÍVEL DE ACESSO PARA ${newRank}?`);

            if (confirmacao) {
                try {
                    const userRef = doc(db, "users", uid);
                    await updateDoc(userRef, {
                        statusPagamento: newStatus,
                        rank: newRank
                    });
                    console.log(`Usuário ${uid} atualizado com sucesso.`);
                } catch (error) {
                    alert("[ ERRO ] FALHA NA COMUNICAÇÃO COM O NÚCLEO.");
                }
            }
        };

        // 🚫 BANIR USUÁRIO (TRAVA DE LOGIN OFFLINE)
        window.banUser = async (uid, name) => {
            if (confirm(`[ CRÍTICO ] DESEJA BANIR O OPERADOR ${name.toUpperCase()}? ELE PERDERÁ ACESSO AO SISTEMA.`)) {
                try {
                    const userRef = doc(db, "users", uid);
                    await updateDoc(userRef, {
                        banido: true,
                        statusPagamento: 'inativo'
                    });
                } catch (error) {
                    alert("[ ERRO ] NÃO FOI POSSÍVEL EXECUTAR O BANIMENTO.");
                }
            }
        };

        // 🗑️ EXCLUIR REGISTRO (Firestore apenas)
        window.deleteUser = async (uid, name) => {
            if (confirm(`[ ALERTA ] DESEJA APAGAR OS DADOS DE ${name.toUpperCase()}? (O login permanecerá no Authentication).`)) {
                try {
                    await deleteDoc(doc(db, "users", uid));
                } catch (error) {
                    alert("[ ERRO ] FALHA AO DELETAR DOCUMENTO.");
                }
            }
        };

        // --- MONITORAMENTO EM TEMPO REAL ---
        onSnapshot(collection(db, "users"), (snapshot) => {
            const tbody = document.getElementById('userTableBody');
            document.getElementById('totalUsers').innerText = snapshot.size;
            tbody.innerHTML = "";

            snapshot.forEach((doc) => {
                const user = doc.data();
                const isRankS = user.statusPagamento === 'ativo';
                const isBanido = user.banido === true;

                const row = `
            <tr class="hover:bg-slate-800/30 transition-colors ${isBanido ? 'opacity-40' : ''}">
                <td class="p-4 border-b border-slate-800">
                    <p class="font-bold text-sm ${isBanido ? 'text-red-500' : 'text-white'}">
                        ${isBanido ? '[BANIDO] ' : ''}${user.username || 'Sem Nome'}
                    </p>
                    <p class="text-[10px] text-slate-500">${user.email || doc.id}</p>
                </td>
                <td class="p-4 border-b border-slate-800">
                    <span class="px-2 py-1 text-[9px] font-black ${isRankS ? 'bg-cyan-500 text-black' : 'bg-slate-800 text-slate-500'}">
                        ${isRankS ? 'RANK-S ATIVO' : 'RANK-E (FREE)'}
                    </span>
                </td>
                <td class="p-4 border-b border-slate-800">
                    <p class="text-[10px] font-bold text-cyan-400">LVL: ${user.level || 1}</p>
                    <p class="text-[10px] text-slate-500">Moedas: ${user.moedas || 0}</p>
                </td>
                <td class="p-4 border-b border-slate-800 flex gap-2">
                    <button onclick="toggleRankS('${doc.id}', '${user.statusPagamento}')" class="bg-cyan-900/30 border border-cyan-400/30 text-cyan-400 p-2 text-xs hover:bg-cyan-400 hover:text-black transition-all">
                        <i class="bi bi-lightning-charge"></i>
                    </button>
                    <button onclick="banUser('${doc.id}', '${user.username}')" class="bg-orange-900/20 border border-orange-500/30 text-orange-500 p-2 text-xs hover:bg-orange-500 hover:text-white">
                        <i class="bi bi-slash-circle"></i>
                    </button>
                    <button onclick="deleteUser('${doc.id}', '${user.username}')" class="bg-red-900/20 border border-red-500/30 text-red-500 p-2 text-xs hover:bg-red-500 hover:text-white">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `;
                tbody.innerHTML += row;
            });
        });
    </script>
</body>

</html>
